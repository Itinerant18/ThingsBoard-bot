# Disable PostgreSQL auto-creation
app.database.create-if-not-exist=false

# H2 Database
spring.datasource.url=jdbc:h2:mem:thingsboard_bot_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Redis and RabbitMQ connection attempts during tests
spring.cache.type=none
spring.data.redis.host=localhost
spring.rabbitmq.host=localhost
spring.rabbitmq.listener.simple.auto-startup=false
