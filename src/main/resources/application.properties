spring.application.name=ThingsBoard-Bot
server.port=8080

spring.profiles.active=dev,chat,ingestion,consumer

# ===== Database =====
# The current bot stores chat memory and normalized branch snapshots in memory.
# H2 is kept as a zero-setup default for local runs.
spring.datasource.url=jdbc:h2:mem:thingsboard_bot_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Cache =====
spring.cache.type=simple
spring.cache.cache-names=device-data,critical-data

# ===== ThingsBoard =====
iotchatbot.thingsboard.url=${TB_URL:https://app.swatch360.seple.in}
iotchatbot.thingsboard.username=${TB_USER:user@example.com}
iotchatbot.thingsboard.password=${TB_PASSWORD:password}
iotchatbot.thingsboard.device-id=${DEVICE_ID:your-device-id}
iotchatbot.thingsboard.timeout=30000
iotchatbot.thingsboard.cache-ttl-seconds=60

# ===== OpenAI =====
iotchatbot.customers.prefixes=BOI,BOB,SBI,CB,IB,PNB,UBI,CBI,IOB,UCO,SEPL
iotchatbot.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
iotchatbot.openai.model=gpt-4o-mini
iotchatbot.openai.max-tokens=2000
iotchatbot.openai.temperature=0.7
iotchatbot.openai.timeout=30000

# ===== RabbitMQ consumer reliability (audit #4) =====
# Auto-ack: container acks on success, rejects on exception. With retry exhausted + requeue
# disabled, a failed message is dead-lettered (to iot.dlx) instead of being silently dropped or
# requeued forever. Prefetch bounds in-flight work per consumer.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# ===== Chatbot =====
iotchatbot.chatbot.max-context-tokens=10000
iotchatbot.chatbot.enable-alerts=true
iotchatbot.chatbot.alert-poll-interval=10000
iotchatbot.chatbot.deterministic-answers-enabled=true
iotchatbot.chatbot.log-decision-metadata=true
iotchatbot.chatbot.branch-alias-strict-mode=false

# ===== Security =====
# Blank by default = guards disabled (local dev unaffected). Set via env to enforce in prod.
#   IOTCHATBOT_SECURITY_WEBHOOK_HMAC_SECRET  -> verify X-HMAC-SHA256 on /webhooks/thingsboard
#   IOTCHATBOT_SECURITY_ADMIN_TOKEN          -> require X-Admin-Token on /api/v1/admin/**
#   IOTCHATBOT_SECURITY_ALLOWED_ORIGINS      -> CORS allow-list (comma-separated; '*' = any)
iotchatbot.security.webhook-hmac-secret=${IOTCHATBOT_SECURITY_WEBHOOK_HMAC_SECRET:}
iotchatbot.security.admin-token=${IOTCHATBOT_SECURITY_ADMIN_TOKEN:}
# Fail closed when a customer has no internal mapping (instead of defaulting to "BOI").
# MUST be true in production to enforce tenant isolation; false keeps local dev working.
iotchatbot.security.strict-customer-mapping=${IOTCHATBOT_SECURITY_STRICT_CUSTOMER_MAPPING:false}
iotchatbot.security.allowed-origins=${IOTCHATBOT_SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
# Base64 HMAC key. Blank = JWT claims read unverified (advisory; ThingsBoard remains authoritative).
# Set to ThingsBoard's signing key to enforce signature verification.
iotchatbot.security.jwt-signing-key=${IOTCHATBOT_JWT_SIGNING_KEY:}
# When true, startup fails unless the signing key above is set (verification mandatory).
# MUST be true in production; false keeps local dev's unverified-decode mode working.
iotchatbot.security.require-jwt-verification=${IOTCHATBOT_SECURITY_REQUIRE_JWT_VERIFICATION:false}
# Allowlist of ThingsBoard hosts the backend may call (SSRF guard on client-supplied X-TB-Host).
iotchatbot.security.allowed-thingsboard-hosts=${IOTCHATBOT_SECURITY_ALLOWED_THINGSBOARD_HOSTS:app.swatch360.seple.in,www.dexterhms.com,dexterhms.com}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# ===== Tracing =====
# Sampling 10%. traceId/spanId are added to logs for correlation. No OTLP exporter is on the
# classpath, so spans are not shipped anywhere until a collector + exporter are configured.
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}

# ===== Hikari Connection Pool Tuning =====
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000

# ===== Logging =====
logging.level.root=INFO
logging.level.com.seple.ThingsBoard_Bot=DEBUG
