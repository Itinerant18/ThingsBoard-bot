# Phase 3 - canned replies for capability intents (HOW_TO / NAVIGATION / TROUBLESHOOTING).
# The bot is the sole dashboard interface: users cannot open ThingsBoard or change devices,
# so these replies state that honestly and redirect to what the bot CAN do.
# Edit wording here freely - no rebuild required beyond a restart.
HOW_TO=I'm a read-only monitoring assistant, so I can't add or change devices, users, or settings - those changes go through your administrator. What I can do is answer questions about your branches' live data. Try asking: "What is the battery voltage at Malda Town?", "How many cameras are online in Liluah?", or "List all offline branches".
NAVIGATION=There's nothing to navigate - I'm the interface. Just ask me directly for what you want to see. For example: "Show alarms for Malda Town", "Which branches are offline right now?", or "What is the HDD status of the NVR at Liluah?".
TROUBLESHOOTING=I can't perform repairs, but I can tell you exactly what the system is reporting so your operations team can act on it. Ask me "Why is <branch> in fault?" or "What is the gateway status of <branch>?" and I'll give you the current fault indicators and device states.
