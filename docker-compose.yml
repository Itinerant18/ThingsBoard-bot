version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-demo
    expose:
      - "8083" # Keep it internal, let Caddy expose it on 443 (HTTPS)
    env_file:
      - .env
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"      # Required for Let's Encrypt verification
      - "443:443"    # HTTPS port
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # explicit config: SSE flush, timeouts, headers (audit #18)
      - caddy_data:/data                        # persistent ACME certs (avoids LE rate limits on restart)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
